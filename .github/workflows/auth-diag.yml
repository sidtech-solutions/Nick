name: auth-diag

on:
  push:
    branches: [ci/auth-diag]

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, bladerunner-macos]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Session facts
        run: |
          id -un; echo "managername (this step): $(launchctl managername)"
          echo "managername (asuser): $(sudo launchctl asuser "$(id -u)" sudo -u "$(id -un)" /bin/launchctl managername)"
          who; last -3 2>/dev/null || true
          echo "--- nick right before ---"
          security authorizationdb read com.ehsanazish.nick.modify-protection 2>&1 | head -2
      - name: Build probe
        run: swiftc -O -o /tmp/authdiag Scripts/ci-diag/authdiag.swift
      - name: Probe, right undefined
        run: |
          echo "ssh session:";  /tmp/authdiag
          echo "aqua session:"; sudo launchctl asuser "$(id -u)" sudo -u "$(id -un)" /tmp/authdiag
      - name: Define the right as the extension does in production
        run: |
          sudo security authorizationdb write com.ehsanazish.nick.modify-protection <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>class</key><string>rule</string>
            <key>rule</key><array><string>authenticate-session-owner-or-admin</string></array>
            <key>shared</key><false/>
            <key>timeout</key><integer>120</integer>
          </dict>
          </plist>
          EOF
          security authorizationdb read com.ehsanazish.nick.modify-protection 2>/dev/null | grep -A1 -E "<key>(class|rule|shared|timeout)</key>" | grep -v '^--'
      - name: Probe, right defined
        run: |
          echo "ssh session:";  /tmp/authdiag
          echo "aqua session:"; sudo launchctl asuser "$(id -u)" sudo -u "$(id -un)" /tmp/authdiag
