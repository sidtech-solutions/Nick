name: Nick CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main, "5.0/develop", ci/github-baseline]
  pull_request:
    branches: [main, "5.0/develop", ci/github-baseline]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  XCODEBUILD_FLAGS: >-
    -project Nick.xcodeproj
    -scheme Nick
    -destination platform=macOS
    -clonedSourcePackagesDirPath SourcePackages
    -enableCodeCoverage YES
    CODE_SIGN_IDENTITY=
    CODE_SIGNING_REQUIRED=NO
    CODE_SIGNING_ALLOWED=NO
    ENABLE_USER_SCRIPT_SANDBOXING=NO

jobs:
  # The YARA rule gate and the Xcode build share nothing, so they run as
  # separate jobs and the workflow finishes when the slower one does.
  yara-rules:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python for YARA
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Decide whether to run the YARA gate
        id: yara-gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          run_yara=false

          # Release PRs, the weekly schedule and explicit manual runs always
          # exercise the benign corpus. Other runs do so only when their diff
          # can change YARA scanning or the pinned YARA/libyara version.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" || \
                ( "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" ) ]]; then
            run_yara=true
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            changed_ci="$(git diff "$BASE_SHA" "$HEAD_SHA" -- .github/workflows/ci.yml)"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
            changed_ci="$(git show --format= "$HEAD_SHA" -- .github/workflows/ci.yml)"
          fi

          if [[ "$run_yara" != "true" ]] && grep -Eq \
            '^(Rules/|Nick/Core/(DeepScan|YARAEngine)/|NickExtension/(Scanner|USB)/|Scripts/rules_gate\.py$)' \
            <<< "${changed_files:-}"; then
            run_yara=true
          fi

          if [[ "$run_yara" != "true" ]] && grep -Eq \
            '^[+-].*yara-python==[0-9]' <<< "${changed_ci:-}"; then
            run_yara=true
          fi

          echo "run=$run_yara" >> "$GITHUB_OUTPUT"
          echo "YARA gate required: $run_yara"

      - name: Lint YARA rules
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet "yara-python==4.5.4"
          .ci-venv/bin/python Scripts/rules_gate.py lint

      - name: YARA false-positive gate (benign corpus)
        if: steps.yara-gate.outputs.run == 'true'
        run: |
          # Runner images carry several Xcode installs that are near-identical
          # copies of each other. Scan only the selected one; the rest would
          # multiply the corpus without adding new benign code.
          selected="$(xcode-select -p)"
          selected="$(cd "${selected%/Contents/Developer}" && pwd -P)"
          excludes=()
          skipped=0
          for app in /Applications/Xcode.app /Applications/Xcode_*.app; do
            [[ -d "$app" ]] || continue
            [[ "$(cd "$app" && pwd -P)" == "$selected" ]] && continue
            excludes+=(--exclude "$app")
            skipped=$((skipped + 1))
          done
          echo "Scanning Xcode at $selected; skipping $skipped other install(s)."

          .ci-venv/bin/python Scripts/rules_gate.py fp \
            --root /System/Applications \
            --root /System/Library/CoreServices \
            --root /usr/bin --root /usr/libexec \
            --root /Applications \
            "${excludes[@]}" \
            --max-files 120000 \
            --time-limit-seconds 1200 \
            --report

      - name: Upload YARA false-positive report
        if: always() && steps.yara-gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yara-fp-report
          path: yara-fp-report.json
          if-no-files-found: ignore
          retention-days: 14

  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect optional CI integrations
        id: optional-integrations
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$CODECOV_TOKEN" && echo "codecov=true" >> "$GITHUB_OUTPUT" || echo "codecov=false" >> "$GITHUB_OUTPUT"
          test -n "$SONAR_TOKEN" && echo "sonar=true" >> "$GITHUB_OUTPUT" || echo "sonar=false" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          # Newest Xcode 26 release; fall back to the newest install of any
          # major if the image carries no 26.x.
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          if [[ -z "$XCODE_PATH" ]]; then
            XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          fi
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Validate repository
        run: ./Scripts/validate-repository.sh

      - name: Cache Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Nick.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # One build covers Nick, every shipping component it embeds or depends
      # on (NickExtension, NickNetFilter, NickHelper, NickUninstaller) and
      # the test bundle, with the coverage settings the test run needs, so
      # nothing is compiled twice.
      - name: Build Nick, shipping components and tests
        run: xcodebuild build-for-testing $XCODEBUILD_FLAGS

      # xcodebuild launches the test host into the console user's Aqua
      # session. On a runner VM that auto-logged that user in moments
      # earlier, loginwindow's credential still satisfies any *undefined*
      # right through authd's default rule (shared, 300s). Define Nick's
      # right exactly as the extension does in production (shared: false)
      # so the verifier tests exercise the real rule instead of the default.
      - name: Register the protection authorization right
        run: |
          sudo security authorizationdb write com.ehsanazish.nick.modify-protection <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>class</key><string>rule</string>
            <key>rule</key><array><string>authenticate-session-owner-or-admin</string></array>
            <key>shared</key><false/>
            <key>timeout</key><integer>120</integer>
          </dict>
          </plist>
          EOF

      - name: Run Tests
        run: |
          rm -rf TestResults.xcresult
          xcodebuild test-without-building $XCODEBUILD_FLAGS \
            -resultBundlePath TestResults.xcresult

      - name: Test Summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult 2>/dev/null || echo "Test results unavailable"

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Convert coverage for Codecov
        run: |
          ./Scripts/xccov-to-lcov.sh TestResults.xcresult > coverage.lcov
          test -s coverage.lcov

      - name: Upload coverage reports to Codecov
        if: steps.optional-integrations.outputs.codecov == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: coverage.lcov
          disable_search: true
          flags: macos
          use_pypi: true
          version: v11.3.1

      - name: Convert coverage for SonarCloud
        if: steps.optional-integrations.outputs.sonar == 'true'
        run: |
          ./Scripts/xccov-to-sonarqube.sh TestResults.xcresult > sonar-coverage.xml
          test -s sonar-coverage.xml

      - name: Run SonarCloud analysis
        if: steps.optional-integrations.outputs.sonar == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
